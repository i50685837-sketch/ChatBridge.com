<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — ChatBridge</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #fff;
      background:
        radial-gradient(circle at 15% 15%, rgba(255,45,155,.35), transparent 35%),
        radial-gradient(circle at 85% 85%, rgba(45,125,255,.35), transparent 35%),
        linear-gradient(135deg, #080b2a, #11145c, #081b48);
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 35px;
      border-radius: 28px;
      background: rgba(255,255,255,.09);
      border: 1px solid rgba(255,255,255,.18);
      box-shadow: 0 25px 70px rgba(0,0,0,.35);
      backdrop-filter: blur(18px);
      animation: appear .7s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      text-align: center;
      font-size: 31px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .logo span {
      color: #ff4eb5;
    }

    .icon {
      width: 78px;
      height: 78px;
      margin: 20px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 34px;
      background: linear-gradient(
        135deg,
        rgba(255,45,155,.25),
        rgba(67,124,255,.25)
      );
      border: 1px solid rgba(255,255,255,.18);
    }

    h1 {
      text-align: center;
      font-size: 27px;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #c6d0ef;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .input-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #e5eaff;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 13px;
      border: 1px solid rgba(255,255,255,.18);
      outline: none;
      color: #fff;
      background: rgba(255,255,255,.08);
      transition: .3s;
    }

    input::placeholder {
      color: #9da8c8;
    }

    input:focus {
      border-color: #ff4eb5;
      box-shadow: 0 0 0 3px rgba(255,78,181,.12);
    }

    .submit-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 30px;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, #ff2999, #437cff);
      box-shadow: 0 12px 30px rgba(255,41,153,.22);
      transition: .3s;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
    }

    .submit-btn:disabled {
      opacity: .65;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 17px;
      text-align: center;
      font-size: 13px;
      line-height: 1.5;
    }

    .message.error {
      display: block;
      color: #ffbdc9;
      background: rgba(255,60,90,.13);
      border: 1px solid rgba(255,60,90,.25);
    }

    .message.success {
      display: block;
      color: #a8f5d2;
      background: rgba(40,220,150,.12);
      border: 1px solid rgba(40,220,150,.25);
    }

    .login {
      text-align: center;
      margin-top: 22px;
      color: #aeb9db;
      font-size: 14px;
    }

    .login a {
      color: #ff62bc;
      text-decoration: none;
      font-weight: 700;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #8fa8dc;
      text-decoration: none;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">
      Chat<span>Bridge</span>
    </div>

    <div class="icon">🔑</div>

    <h1>Forgot Password?</h1>

    <p class="subtitle">
      Enter your email address and, if an account exists,
      we'll send instructions to reset your password.
    </p>

    <div id="message" class="message"></div>

    <form id="forgotForm">

      <div class="input-group">
        <label for="email">Email Address</label>

        <input
          type="email"
          id="email"
          name="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        >
      </div>

      <button
        type="submit"
        class="submit-btn"
        id="submitBtn"
      >
        Send Reset Instructions
      </button>

    </form>

    <div class="login">
      Remember your password?
      <a href="login.html">Login</a>
    </div>

    <a href="index.html" class="back">
      ← Back to ChatBridge
    </a>

  </div>

  <script>
    const form = document.getElementById("forgotForm");
    const submitBtn = document.getElementById("submitBtn");
    const message = document.getElementById("message");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = document
        .getElementById("email")
        .value
        .trim();

      submitBtn.disabled = true;
      submitBtn.textContent = "Sending...";

      try {
        const response = await fetch(
          "/api/auth/forgot-password",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              email
            })
          }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(
            data.message ||
            "Unable to process your request."
          );
        }

        showMessage(
          data.message ||
          "If an account exists for that email, reset instructions will be sent.",
          "success"
        );

        form.reset();

      } catch (error) {
        showMessage(
          error.message ||
          "Unable to connect to the ChatBridge server.",
          "error"
        );
      }

      submitBtn.disabled = false;
      submitBtn.textContent = "Send Reset Instructions";
    });
  </script>

</body>
</html>
