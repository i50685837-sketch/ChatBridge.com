<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — ChatBridge</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #fff;
      background:
        radial-gradient(circle at 15% 15%, rgba(255,45,155,.35), transparent 35%),
        radial-gradient(circle at 85% 85%, rgba(45,125,255,.35), transparent 35%),
        linear-gradient(135deg, #080b2a, #11145c, #081b48);
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 35px;
      border-radius: 28px;
      background: rgba(255,255,255,.09);
      border: 1px solid rgba(255,255,255,.18);
      box-shadow: 0 25px 70px rgba(0,0,0,.35);
      backdrop-filter: blur(18px);
      animation: show .7s ease;
    }

    @keyframes show {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      text-align: center;
      font-size: 31px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .logo span {
      color: #ff4eb5;
    }

    .subtitle {
      text-align: center;
      color: #c6d0ef;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .input-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #e5eaff;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 13px;
      border: 1px solid rgba(255,255,255,.18);
      outline: none;
      color: #fff;
      background: rgba(255,255,255,.08);
      transition: .3s;
    }

    input::placeholder {
      color: #9da8c8;
    }

    input:focus {
      border-color: #ff4eb5;
      box-shadow: 0 0 0 3px rgba(255,78,181,.12);
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 50px;
    }

    .toggle {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: #b9c7ec;
      cursor: pointer;
      font-size: 18px;
    }

    .forgot {
      display: block;
      text-align: right;
      margin-top: -7px;
      margin-bottom: 22px;
      color: #66aaff;
      text-decoration: none;
      font-size: 13px;
    }

    .login-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 30px;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, #ff2999, #437cff);
      box-shadow: 0 12px 30px rgba(255,41,153,.22);
      transition: .3s;
    }

    .login-btn:hover {
      transform: translateY(-2px);
    }

    .login-btn:disabled {
      opacity: .65;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 17px;
      text-align: center;
      font-size: 13px;
      line-height: 1.5;
    }

    .message.error {
      display: block;
      color: #ffbdc9;
      background: rgba(255,60,90,.13);
      border: 1px solid rgba(255,60,90,.25);
    }

    .message.success {
      display: block;
      color: #a8f5d2;
      background: rgba(40,220,150,.12);
      border: 1px solid rgba(40,220,150,.25);
    }

    .register {
      text-align: center;
      margin-top: 23px;
      color: #aeb9db;
      font-size: 14px;
    }

    .register a {
      color: #ff62bc;
      font-weight: 700;
      text-decoration: none;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #8fa8dc;
      text-decoration: none;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">
      Chat<span>Bridge</span>
    </div>

    <p class="subtitle">
      Welcome back. Login to continue chatting.
    </p>

    <div id="message" class="message"></div>

    <form id="loginForm">

      <div class="input-group">
        <label for="email">Email Address</label>

        <input
          type="email"
          id="email"
          name="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        >
      </div>

      <div class="input-group">
        <label for="password">Password</label>

        <div class="password-wrap">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >

          <button
            type="button"
            class="toggle"
            id="togglePassword"
            aria-label="Show password"
          >👁</button>
        </div>
      </div>

      <a href="forgot-password.html" class="forgot">
        Forgot password?
      </a>

      <button type="submit" class="login-btn" id="loginBtn">
        Login
      </button>

    </form>

    <div class="register">
      Don't have an account?
      <a href="register.html">Create Account</a>
    </div>

    <a href="index.html" class="back">
      ← Back to ChatBridge
    </a>

  </div>

  <script>
    const loginForm = document.getElementById("loginForm");
    const loginBtn = document.getElementById("loginBtn");
    const message = document.getElementById("message");
    const passwordInput = document.getElementById("password");
    const togglePassword = document.getElementById("togglePassword");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    togglePassword.addEventListener("click", () => {
      if (passwordInput.type === "password") {
        passwordInput.type = "text";
        togglePassword.textContent = "🙈";
      } else {
        passwordInput.type = "password";
        togglePassword.textContent = "👁";
      }
    });

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = document
        .getElementById("email")
        .value
        .trim();

      const password = passwordInput.value;

      loginBtn.disabled = true;
      loginBtn.textContent = "Logging in...";

      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            email,
            password
          })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {

          if (data.activationRequired && data.userId) {
            sessionStorage.setItem(
              "chatbridge_user_id",
              data.userId
            );

            window.location.href = "activation.html";
            return;
          }

          throw new Error(
            data.message || "Login failed."
          );
        }

        localStorage.setItem(
          "chatbridge_token",
          data.token
        );

        localStorage.setItem(
          "chatbridge_user",
          JSON.stringify(data.user)
        );

        showMessage(
          "Login successful. Opening dashboard...",
          "success"
        );

        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 700);

      } catch (error) {

        showMessage(
          error.message ||
          "Unable to connect to the ChatBridge server.",
          "error"
        );

        loginBtn.disabled = false;
        loginBtn.textContent = "Login";
      }
    });
  </script>

</body>
</html>
